g" aria-modal="true" aria-label="ゲームメニュー"><div class="menuBox"><h2>MENU</h2><button id="closeMenu" type="button">閉じる・ゲームに戻る</button><button id="titleFromMenu" type="button">タイトルに戻る</button><div id="titleConfirm" hidden><p>保存していない進行状況は失われます。タイトルに戻りますか？</p><button id="confirmTitle" type="button">タイトルに戻る（確定）</button><button id="cancelTitle" type="button">キャンセル</button></div><p>タイトルに戻る前に、必要ならSAVEで保存してください。</p></div></div><div id="overlay"><div class="titleLayout"><img class="titleCharacter" src="images/tsuruya_full_normal.png" alt="鶴矢先輩の立ち絵"><div class="titleCopy"><div class="titleEyebrow">LITERATURE CLUB · SUMMER</div><h1>鶴矢先輩と僕の日常</h1><p class="titleTagline">――まだ書かれていない放課後の続きを、君と。</p><p class="titleVersion">第一話　夏の部室　｜　Ver.0.9.2</p><div class="titleButtons"><button id="start" type="button">はじめから</button><button id="continue" type="button">つづきから</button></div><p class="titleFooter">横画面推奨・タップで読み進める<br>音声はゲーム開始後に再生されます</p><p id="diagnostic" class="titleFooter">読み込み中…</p></div></div></div></main></div><div id="rotate"><div><span>↻</span>iPhoneを横向きにしてください<br><small>横画面で物語が始まります</small></div></div><script>
'use strict';const $=id=>document.getElementById(id);const scenes=[
{n:'稲見',t:'八月の終わり。夏休みの校舎は、いつもより少しだけ広く感じる。',hide:true},
{n:'稲見',t:'文芸部の扉を開けると、鶴矢先輩が窓際の席で文庫本を読んでいた。'},
{n:'鶴矢先輩',t:'……あ、来た。今日はずいぶん早いね。'},
{n:'稲見',t:'先輩こそ。何か書いていたんですか。'},
{n:'鶴矢先輩',t:'ううん。今日は何もしない日にしようかなって。……君はどうする？',c:[['先輩の隣に座る',5,1],['何か書きませんか、と提案する',7,0]]},
{n:'鶴矢先輩',t:'ふふ。君も暇なんだね。……まあ、私もだけど。',to:9},
{n:'稲見',t:'',to:9},
{n:'鶴矢先輩',t:'真面目だなあ。じゃあ、何も書かないことについて書いてみる？',to:8},
{n:'稲見',t:'それ、もう何か書いてることになりませんか。',to:9},
{n:'稲見',t:'扇風機が首を振る。机の端には、見慣れない生成り色のノートが置かれていた。'},

const soundFiles={ambient:'audio/ohirusugi.mp3',page:'audio/page.wav',wind:'audio/wind.wav',mystery:'audio/mystery.wav'};
let audioCtx=null,masterGain=null,ambientGain=null,ambientSource=null;
let buffers={},pending={},soundUnlocked=false,muted=false,volume=.55;
const status=msg=>{$('soundStatus').textContent=msg};
function applyVolume(){
  if(masterGain&&audioCtx)masterGain.gain.setTargetAtTime(muted?0:volume,audioCtx.currentTime,.015);
  $('mute').textContent=muted?'音を出す':'音を消す';
  $('mute').setAttribute('aria-pressed',String(muted));
  $('sound').setAttribute('aria-pressed',String(!muted));
  $('volume').value=Math.round(volume*100);
  $('volumeValue').textContent=Math.round(volume*100)+'%';
}
function initAudio(){
  if(!audioCtx){
    try{
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=audioCtx.createGain();masterGain.connect(audioCtx.destination);
      ambientGain=audioCtx.createGain();ambientGain.gain.value=.52;ambientGain.connect(masterGain);
      applyVolume();
    }catch(e){status('このブラウザは音声に対応していません');return}
  }
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  for(const key of Object.keys(soundFiles))if(!buffers[key]&&!pending[key]){
    pending[key]=fetch(soundFiles[key]).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.arrayBuffer()})
      .then(b=>audioCtx.decodeAudioData(b)).then(buf=>{buffers[key]=buf;delete pending[key];return buf})
      .catch(e=>{delete pending[key];status('音声読込エラー：'+key);return null});
  }
}
async function startAmbience(){
  if(!audioCtx||ambientSource)return;
  const ctx=audioCtx;
  try{
    const buf=buffers.ambient||(pending.ambient?await pending.ambient:null);
    if(!buf||ambientSource||ctx!==audioCtx)return;
    const source=ctx.createBufferSource();source.buffer=buf;source.loop=true;
    source.connect(ambientGain);source.start();ambientSource=source;
    status('BGM：再生中（音量 '+Math.round(volume*100)+'%）');
  }catch(e){status('環境音を開始できませんでした')}
}
function unlockSound(){soundUnlocked=true;initAudio();applyVolume();startAmbience()}
async function cue(name,manual=false){
  if(!soundUnlocked){if(manual)status('先に「はじめから」を押してください');return}
  initAudio();if(!audioCtx)return;
  try{
    const buf=buffers[name]||(pending[name]?await pending[name]:null);
    if(!buf){status('音声を読み込めませんでした');return}
    if(audioCtx.state==='suspended')await audioCtx.resume();
    const source=audioCtx.createBufferSource(),gain=audioCtx.createGain();
    source.buffer=buf;gain.gain.value=.95;source.connect(gain);gain.connect(masterGain);source.start();
    if(manual)status(muted?'ミュート中です（再生テストは無音）':'再生しました：'+({page:'紙',wind:'風',mystery:'謎'}[name]||name));
  }catch(e){status('再生できません。画面をタップして再試行してください')}
}
